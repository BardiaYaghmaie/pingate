# Direct Docker socket mount. See the Readme's "Docker API security"
# section for when to swap this for a restricted, non-root socket-proxy
# sidecar instead.
services:
  pingate:
    image: ${PINGATE_IMAGE:-ghcr.io/bardiayaghmaie/pingate:latest}
    user: root
    environment:
      PINGATE_MODE: swarm
      PINGATE_DOCKER_HOST: unix:///var/run/docker.sock
      PINGATE_DOCKER_DEFAULT_NETWORK: pingate-public
      RUST_LOG: info
    ports:
      - target: 6198
        published: 6198
        protocol: tcp
        mode: ingress
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - public
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  api:
    image: nginx:alpine
    networks:
      - public
    deploy:
      replicas: 2
      labels:
        pingate.enable: "true"
        pingate.host: api.localhost
        pingate.port: "80"
        pingate.network: pingate-public

networks:
  public:
    external: true
    name: pingate-public
