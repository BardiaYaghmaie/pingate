[advisories]
# Prometheus 0.13, pulled in by Pingora 0.8.1, pins protobuf 2.28. Pingate only
# uses Prometheus' in-process metric serialization and never parses untrusted
# protobuf input. Remove this exception when Pingora upgrades Prometheus.
ignore = ["RUSTSEC-2024-0437"]
informational_warnings = ["unmaintained"]

[output]
deny = []
format = "terminal"
quiet = false
show_tree = true
