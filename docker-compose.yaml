# Direct Docker socket mount. See the Readme's "Docker API security"
# section for when to swap this for a restricted, non-root socket-proxy sidecar instead.
services:
  pingate:
    image: ghcr.io/bardiayaghmaie/pingate:latest
    user: root
    environment:
      PINGATE_MODE: compose
      PINGATE_DOCKER_HOST: unix:///var/run/docker.sock
    ports:
      - "6198:6198"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      # Provides writable, in-memory temporary storage because /tmp would otherwise be read-only.
      # Its contents disappear when the container stops.
      - /tmp
    security_opt:
      # Prevents Pingate and child processes from gaining extra privileges through mechanisms such as setuid binaries.
      - no-new-privileges:true
    cap_drop:
      # Removes all Linux capabilities, such as changing network configuration or bypassing file permissions.
      # Pingate needs none for ordinary proxying.
      - ALL

  api1:
    image: nginx:alpine
    volumes:
      - ./smoke/api1:/usr/share/nginx/html:ro
    labels:
      pingate.enable: "true"
      pingate.host: api.localhost
      pingate.port: "80"

  api2:
    image: nginx:alpine
    volumes:
      - ./smoke/api2:/usr/share/nginx/html:ro
    labels:
      pingate.enable: "true"
      pingate.host: api.localhost
      pingate.port: "80"
