# Direct Docker socket mount. See the Readme's "Docker API security"
# section for when to swap this for a restricted, non-root socket-proxy sidecar instead.
services:
  pingate:
    build: .
    image: pingate:local
    user: root
    environment:
      PINGATE_MODE: compose
      PINGATE_DOCKER_HOST: unix:///var/run/docker.sock
      PINGATE_DOCKER_DEFAULT_NETWORK: pingate-public
      RUST_LOG: info
    ports:
      - "${PINGATE_PUBLISHED_PORT:-6198}:6198"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - public
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  api1:
    image: nginx:alpine
    volumes:
      - ./smoke/api1:/usr/share/nginx/html:ro
    labels:
      pingate.enable: "true"
      pingate.host: api.localhost
      pingate.port: "80"
      pingate.network: pingate-public
    networks:
      - public

  api2:
    image: nginx:alpine
    volumes:
      - ./smoke/api2:/usr/share/nginx/html:ro
    labels:
      pingate.enable: "true"
      pingate.host: api.localhost
      pingate.port: "80"
      pingate.network: pingate-public
    networks:
      - public

networks:
  public:
    name: pingate-public
